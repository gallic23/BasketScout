name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set application version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == "tag" ]]; then
            version="${REF_NAME#v}"
          else
            version="$(git describe --tags --abbrev=0 2>/dev/null || true)"
            if [[ -z "$version" ]]; then
              version="$(sed -n "s/^window.BASKETSCOUT_VERSION = '\([^']*\)';$/\1/p" assets/js/version.js)"
            fi
            version="${version#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version '$version'. Use tags in vX.Y.Z format." >&2
            exit 1
          fi

          printf "window.BASKETSCOUT_VERSION = '%s';\n" "$version" > assets/js/version.js

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare site
        run: |
          mkdir _site
          cp index.html _site/
          cp -R assets _site/assets

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
